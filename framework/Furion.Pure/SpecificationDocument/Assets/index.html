<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>%(DocumentTitle)</title>
    <link rel="stylesheet" type="text/css" href="%(StylesPath)">
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
    <style>
        html{box-sizing:border-box;overflow:-moz-scrollbars-vertical;overflow-y:scroll}
        *,:after,:before{box-sizing:inherit}
        body{margin:0;background:#fafafa}
        #login-form{position:fixed;top:30px;left:50%;margin-left:-191px;width:382px;display:none;border-color:#49cc90;background:rgba(73,204,144,.1);border:1px solid #000;border-radius:8px;box-shadow:0 0 3px rgb(0 0 0 / 19%);font-family:monospace;overflow:hidden}
        .login-title{background-color:#1b1b1b;height:60px;padding:10px;}
        .login-area{padding:25px 40px 32px;background-color:#e8f6f0;height:280px}
        .form-row{padding:6px 0}
        .form-row label{font-size:14px;flex:1;margin:0;font-family:sans-serif;color:#3b4151;font-weight:700}
        .form-row input{font-size:14px;width:100%;max-width:340px;min-width:100px;margin:5px 0;padding:10px;border:1px solid #d9d9d9;border-radius:4px;background:#fff}
        .form-row button{padding:10px 40px;font-size:14px;border:none;outline:0;font-weight:700;cursor:pointer;border-radius:3px;background-color:#4990e2;color:#fff;border-color:#4990e2;box-shadow:0 0 5px rgb(0 0 0 / 30%);width:100%;box-sizing:border-box}
        .form-row button:hover{opacity:.8}
        #login-error{font-size:14px;flex:1;margin:0;font-family:sans-serif;color:red;margin-top:8px}
        html.dark-mode #login-form{border:1px solid #545d61}
        html.dark-mode #login-form .login-area{background:#1c2022}
        html.dark-mode #login-form .form-row input{background:#1c2022;border-color:#b7bcbf;color:#f0f1f1}
        html.dark-mode #login-form .form-row label{color:#e4e6e6}
        .swagger-logout-btn{background:0 0;border:none;cursor:pointer;font-size:18px;margin-left:15px;color:#3b4151;padding:5px;line-height:1;display:flex;align-items:center;color:#bcbdbd;font-size:22px!important;position:relative;top:-2px}
        .swagger-logout-btn:hover{opacity:.7}
        html.dark-mode .swagger-logout-btn{color:#f0f1f1}
        .logo_small_svg__cls-2 {fill: #fff}
        .logo_small_svg__cls-3 {fill: #85ea2d}
    </style>
    %(HeadContent)
</head>

        <div class="login-area">
            <div class="form-row">
                <label for="userName">Account: </label>
                <input type="text" id="userName" name="userName" />
            </div>
            <div class="form-row">
                <label for="password">Password: </label>
                <input type="password" id="password" name="password" />
            </div>
            <div class="form-row">
                <button id="submit">Submit</button>
            </div>
            <div id="login-error"></div>
        </div>
    </div>

    <script src="%(ScriptBundlePath)" charset="utf-8"></script>
    <script src="%(ScriptPresetsPath)" charset="utf-8"></script>
    <script>
        /* Source: https://gist.github.com/lamberta/3768814
         * Parse a string function definition and return a function object. Does not use eval.
         * @param {string} str
         * @return {function}
         *
         * Example:
         *  var f = function (x, y) { return x * y; };
         *  var g = parseFunction(f.toString());
         *  g(33, 3); //=> 99
         */
        function parseFunction(str) {
            if (!str) return void (0);

            var fn_body_idx = str.indexOf('{'),
                fn_body = str.substring(fn_body_idx + 1, str.lastIndexOf('}')),
                fn_declare = str.substring(0, fn_body_idx),
                fn_params = fn_declare.substring(fn_declare.indexOf('(') + 1, fn_declare.lastIndexOf(')')),
                args = fn_params.split(',');

            args.push(fn_body);

            function Fn() {
                return Function.apply(this, args);
            }
            Fn.prototype = Function.prototype;

            return new Fn();
        }

        // get uri all query variables
        function getQueryVariables(uri) {
            var searchArgs = window.location.search;
            if (uri) {
                var s = uri.indexOf('?');
                searchArgs = s > -1 ? uri.substring(s) : '';
            }
            var query = searchArgs.substring(1);
            var vars = query.split('&');
            var varObj = {};
            for (var i = 0; i < vars.length; i++) {
                var pair = vars[i].split('=');
                varObj[pair[0]] = pair[1];
            }
            return varObj;
        }

        // get uri query variable
        function getQueryVariable(variable, uri) {
            var vars = getQueryVariables(uri);
            for (var key in vars) {
                if (key === variable) return vars[key];
            }
            return (false);
        }

        // if value is null or undefined than execute delete operate, else execute update
        function updateQueryVariable(uri, key, value) {
            var re = new RegExp('([?&])' + key + '=.*?(&|$)', 'i');
            var separator = uri.indexOf('?') !== -1 ? '&' : '?';
            if (uri.match(re)) {
                return uri.replace(re, !value ? '' : ('$1' + key + '=' + value + '$2'));
            }
            else {
                return !value ? '' : (uri + separator + key + '=' + value);
            }
        }

        // get uri template
        function getUrlTemplate(uri) {
            var reg = /\{(.+?)\}/g;
            return uri.match(reg);
        }

        // hide empty tags
        var HideEmptyTagsPlugin = function HideEmptyTagsPlugin() {
            return {
                statePlugins: {
                    spec: {
                        wrapSelectors: {
                            taggedOperations: function taggedOperations(ori) {
                                return function () {
                                    return ori.apply(void 0, arguments).filter(function (tagMeta) {
                                        return tagMeta.get("operations") && tagMeta.get("operations").size > 0;
                                    });
                                };
                            }
                        }
                    }
                }
            };
        };

        var tokenKey = "access-token";
        var cultureKey = "culture";
        var loginSessionKey = "swagger-logged-in";

        // default response interceptor
        function defaultResponseInterceptor(response) {
            // handle jwt token
            var accessToken = response.headers[tokenKey];
            if (accessToken && accessToken != "invalid_token") {
                window.localStorage.setItem(tokenKey, accessToken);
                window.ui.preauthorizeApiKey("Bearer", accessToken);
            }
            else if (accessToken == "invalid_token") {
                window.localStorage.removeItem(tokenKey);
                window.ui.authActions.logout(["Bearer"]);
            }

            return response;
        }

        // default request interceptor
        function defaultRequestInterceptor(request) {
            var url = request.url;

            // add swagger header
            request.headers["request-from"] = "swagger";

            // handle template
            var temps = getUrlTemplate(url);
            if (temps && temps.length > 0) {
                for (var i = 0; i < temps.length; i++) {
                    var temp = temps[i];
                    var key = temp.substring(1, temp.length - 1);
                    var queryKey = getQueryVariable(key, url);
                    if (queryKey) {
                        url = updateQueryVariable(url.replace(temp, queryKey), key);
                    }
                    else url = url.replace(temp, '');
                }
                request.url = url;
            }

            // handle culture lang
            var culture = getQueryVariable(cultureKey);
            if (culture && culture.length > 0) {
                request.url = updateQueryVariable(url, cultureKey, culture);
            }

            return request;
        }

        // send ajax request
        function sendRequest(params) {
            let xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    let obj = JSON.parse(xhr.response);
                    let headers = xhr.getAllResponseHeaders();
                    let arr = headers.trim().split(/[\r\n]+/);
                    let headerMap = {};
                    arr.forEach(function (line) {
                        let parts = line.split(': ');
                        let header = parts.shift();
                        let value = parts.join(': ');
                        headerMap[header] = value;
                    });

                    params.success(obj, headerMap);
                } else if (xhr.readyState == 4 && xhr.status >= 400) {
                    params.error(xhr);
                }
            }

            function objectToString(obj) {
                let arr = [];
                for (var k in obj) {
                    arr.push(`${k}=${encodeURIComponent(obj[k])}`);
                }

                return arr.join('&');
            }

            let qs = objectToString(params.data);

            var accessToken = window.localStorage.getItem(tokenKey);

            if (params.method.toUpperCase() == 'GET') {
                xhr.open('GET', params.url + '?' + qs);
                if (accessToken) {
                    xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
                }
                xhr.send();
            } else if (params.method.toUpperCase() == 'POST') {
                xhr.open('POST', params.url);
                if (accessToken) {
                    xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
                }
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                xhr.send(qs);
            }
        }

        function appendLogoutButton(loginObject) {
            if (!loginObject || loginObject.Enabled !== true) return;

            var topbarWrapper = document.querySelector('.topbar-wrapper');
            if (!topbarWrapper) {
                setTimeout(function () { appendLogoutButton(loginObject); }, 200);
                return;
            }

            if (document.getElementById('swagger-logout-btn')) return;

            var btn = document.createElement('button');
            btn.id = 'swagger-logout-btn';
            btn.className = 'swagger-logout-btn';
            btn.innerHTML = '⏻';
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                window.sessionStorage.removeItem(loginSessionKey);
                window.location.reload();

                window.localStorage.removeItem(tokenKey);
                window.ui.authActions.logout(["Bearer"]);
            });

            topbarWrapper.appendChild(btn);
        }

        // init swagger ui
        function initSwaggerUI(configObject, oauthConfigObject) {
            configObject.onComplete = function () {
                var accessToken = window.localStorage.getItem(tokenKey);
                if (accessToken) {
                    window.ui.preauthorizeApiKey("Bearer", accessToken);
                }

                appendLogoutButton(window.__swaggerLoginInfo);
            };

            // Workaround for https://github.com/swagger-api/swagger-ui/issues/5945
            configObject.urls.forEach(function (item) {
                if (item.url.startsWith("http") || item.url.startsWith("/")) return;
                item.url = window.location.href.replace("index.html", item.url).split('#')[0];
            });

            // If validatorUrl is not explicitly provided, disable the feature by setting to null
            if (!configObject.hasOwnProperty("validatorUrl"))
                configObject.validatorUrl = null

            // If oauth2RedirectUrl isn't specified, use the built-in default
            if (!configObject.hasOwnProperty("oauth2RedirectUrl"))
                configObject.oauth2RedirectUrl = (new URL("oauth2-redirect.html", window.location.href)).href;

            // Apply mandatory parameters
            configObject.dom_id = "#swagger-ui";
            configObject.presets = [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset, HideEmptyTagsPlugin];
            configObject.layout = "StandaloneLayout";

            // Parse and add interceptor functions
            var interceptors = JSON.parse('%(Interceptors)');
            if (interceptors.RequestInterceptorFunction)
                configObject.requestInterceptor = parseFunction(interceptors.RequestInterceptorFunction);
            if (interceptors.ResponseInterceptorFunction)
                configObject.responseInterceptor = parseFunction(interceptors.ResponseInterceptorFunction);

            // Begin Swagger UI call region

            const ui = SwaggerUIBundle(configObject);

            ui.initOAuth(oauthConfigObject);

            // End Swagger UI call region

            window.ui = ui;
        }

        window.onload = function () {
            var configObject = JSON.parse('%(ConfigObject)');
            var oauthConfigObject = JSON.parse('%(OAuthConfigObject)');

            window.__swaggerLoginInfo = configObject.LoginInfo;

            if (configObject.DarkMode === true) {
                document.documentElement.classList.add("dark-mode");
            }

            if (window.sessionStorage.getItem(loginSessionKey) === "true") {
                initSwaggerUI(configObject, oauthConfigObject);
                return;
            }

            var loginObject = configObject.LoginInfo;
            if (loginObject && loginObject.Enabled === true) {
                var loginForm = document.getElementById("login-form");
                var userName = document.getElementById("userName");
                userName.value = loginObject.DefaultUsername;
                var password = document.getElementById("password");
                password.value = loginObject.DefaultPassword;
                var submit = document.getElementById("submit");
                var loginError = document.getElementById("login-error");
                loginForm.style.display = "block";

                sendRequest({
                    method: "POST",
                    url: loginObject.CheckUrl,
                    success: function (res, headerMap) {
                        if (res.toString() === "200") {
                            loginForm.style.display = "none";
                            window.sessionStorage.setItem(loginSessionKey, "true");
                            initSwaggerUI(configObject, oauthConfigObject);
                        }
                        else {
                            userName.focus();

                            submit.addEventListener("click", function (ev) {
                                if (userName.value.trim().length === 0) {
                                    userName.focus();
                                    return;
                                }
                                if (password.value.trim().length === 0) {
                                    password.focus();
                                    return;
                                }

                                loginError.innerHTML = "";

                                sendRequest({
                                    method: "POST",
                                    url: loginObject.SubmitUrl,
                                    data: {
                                        userName: userName.value.trim(),
                                        password: password.value.trim()
                                    },
                                    success: function (res, headerMap) {
                                        if (res.toString() === "200") {
                                            loginForm.style.display = "none";
                                            window.sessionStorage.setItem(loginSessionKey, "true");
                                            initSwaggerUI(configObject, oauthConfigObject);
                                            defaultResponseInterceptor({ headers: headerMap });
                                        }
                                        else {
                                            userName.focus();
                                            loginError.innerHTML = "The account or password is invalid.";
                                        }
                                    },
                                    error: function (xhr) {
                                        if (xhr.status === 404) {
                                            loginError.innerHTML = "Not Found: " + loginObject.SubmitUrl;
                                        }
                                        else {
                                            loginError.innerHTML = "Internal ServerError: " + loginObject.SubmitUrl;
                                        }
                                    }
                                });
                            });
                        }
                    },
                    error: function (xhr) {
                        if (xhr.status === 404) {
                            loginError.innerHTML = "Not Found: " + loginObject.CheckUrl;
                        }
                        else {
                            loginError.innerHTML = "Internal ServerError: " + loginObject.CheckUrl;
                        }
                    }
                });
            }
            else {
                initSwaggerUI(configObject, oauthConfigObject);
            }
        }
